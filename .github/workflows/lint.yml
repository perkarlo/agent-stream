name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sözdizimi (py_compile)
        run: python3 -m py_compile agent-stream

      - name: Kod ↔ README ↔ CLAUDE.md
        run: ./.github/checks.sh
